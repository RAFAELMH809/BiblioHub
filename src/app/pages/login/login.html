<section class="bg-hero" style="--hero: url('/assets/login.jpg')">
  <div class="center">
    <h1>Iniciar sesión</h1>
    <form class="stack">
      <app-input placeholder="Usuario"></app-input>
      <app-password-input placeholder="Contraseña"></app-password-input>
      <app-button>Iniciar</app-button>
    </form>
    <div style="margin-top:24px">
      <p>¿Ya tienes un perfil personal?
        <a routerLink="/signup" style="color:#fff; text-decoration:underline;">Crear cuenta</a></p>
      <p>¿Olvidaste tu contraseña?
        <a style="color:#fff; text-decoration:underline;">Recuperar contraseña</a></p>
    </div>
  </div>
</section>
