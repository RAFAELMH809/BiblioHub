<header class="topbar fullbleed">
  <div class="topbar__row">
    <button class="icon-btn" aria-label="menu">
      <img src="assets/icons/menu.png" alt="" />
    </button>

    <img class="brand" src="assets/brand/logo-full.png" alt="BiblioHub" />

    <div class="search">
      <img class="search__icon" src="assets/icons/search.png" alt="" />
      <input class="search__input" placeholder="Buscar" />
    </div>

    <!-- 🔵 Acciones de autenticación (reemplaza favoritos/mark/avatar) -->
    <div class="auth-actions">
      <a class="btn btn--ghost" routerLink="/login">Iniciar sesión</a>
      <a class="btn btn--primary" routerLink="/signup">Crear cuenta</a>
    </div>
  </div>

  <!-- barra azul -->
  <nav class="catbar fullbleed">
    <div class="catbar__row">
      <a routerLink="/home">Ciencias</a>
      <a routerLink="/home">Matematicas</a>
      <a routerLink="/home">Historia</a>
      <a routerLink="/home" class="active">Negocios</a>
      <a routerLink="/home">Ingeniería</a>
    </div>
  </nav>
</header>
