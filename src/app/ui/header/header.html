<header
  *ngIf="!isProfileRoute"
  class="topbar"
  [class.topbar--home]="isHomeRoute && !isAuthRoute"
  [class.topbar--favorites]="isFavoritesRoute"
>

  <!-- ===== Header normal (HOME público y HOME de usuario) ===== -->
  <div class="topbar__row" *ngIf="!isAuthRoute">
    <!-- Logo -->
    <a
      class="brand-wrap"
      [routerLink]="isLoggedIn ? '/home-user' : '/home'"
      aria-label="BiblioHub"
    >
      <img src="assets/brand/logo-full.png" alt="BiblioHub" />
    </a>

    <!-- Botones Iniciar sesión / Crear cuenta (solo cuando NO hay sesión) -->
    <div class="auth-actions" *ngIf="!isLoggedIn">
      <a class="btn btn--ghost" routerLink="/login">Iniciar sesión</a>
      <a class="btn btn--primary" routerLink="/signup">Crear cuenta</a>
    </div>

    <!-- Botones de usuario (solo cuando SÍ hay sesión) -->
    <div class="user-actions" *ngIf="isLoggedIn">
      <button
        class="fav-btn"
        type="button"
        routerLink="/favorites"
      >
        <img src="assets/icons/heart.png" alt="" />
        <span>Favoritos</span>
      </button>

      <button
        class="avatar-btn"
        type="button"
        routerLink="/profile"
        aria-label="Perfil de usuario"
      >
        <img src="assets/icons/avatar.png" alt="Perfil" />
      </button>
    </div>
  </div>

  <!-- ===== Header minimal para login/signup/onboarding ===== -->
  <div class="topbar__row topbar__row--auth" *ngIf="isAuthRoute">
    <button
      type="button"
      class="brand-wrap brand-wrap--button"
      (click)="onAuthLogoClick()"
      aria-label="BiblioHub"
    >
      <img src="assets/brand/logo-full.png" alt="BiblioHub" />
    </button>
  </div>

  <!-- ===== Barra azul de búsqueda ===== -->
  <nav class="catbar fullbleed" *ngIf="!isAuthRoute">
    <div class="catbar__row">
      <!-- Categorías -->
      <select
        #catSelect
        class="catbar__select"
      >
        <option value="" selected>Categorías</option>
        <option value="Ingeniería">Ingeniería</option>
        <option value="Salud">Salud</option>
        <option value="Educación">Educación</option>
        <option value="Cultura">Cultura</option>
        <option value="Religión">Religión</option>
        <option value="Gastronomía">Gastronomía</option>
        <option value="Historia">Historia</option>
        <option value="Tecnologías">Tecnologías</option>
        <option value="Negocios">Negocios</option>
        <option value="Ciencias">Ciencias</option>
        <option value="Matemáticas">Matemáticas</option>
        <option value="Arte">Arte</option>
      </select>

      <!-- Título -->
      <input
        #titleInput
        class="catbar__input"
        type="text"
        placeholder="Libros/Título"
      />

      <!-- Autor -->
      <input
        #authorInput
        class="catbar__input"
        type="text"
        placeholder="Autor(es)"
      />

      <!-- Botón Buscar -->
      <button
        class="catbar__search-btn"
        type="button"
        (click)="onSearchClick(catSelect.value, titleInput.value, authorInput.value)"
      >
        <img src="assets/icons/search.png" alt="" />
        <span>Buscar</span>
      </button>
    </div>
  </nav>
</header>
