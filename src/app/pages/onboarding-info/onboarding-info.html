<!-- Backdrop del modal (ocupa toda la pantalla) -->
<section class="onb">
  <div class="onb__modal">
    <!-- encabezado -->
    <div class="onb__header">
      <h2>Cuéntanos sobre ti…</h2>
      <button class="x" (click)="close()" aria-label="Cerrar">×</button>
    </div>

    <!-- contenido en dos columnas -->
    <div class="onb__content">
      <!-- Columna izquierda: título del paso + opciones tipo pill -->
      <div class="onb__left">
        <h3 class="step-title">{{ step.title }}</h3>

        <div class="pill-list">
          <button
            class="pill"
            *ngFor="let opt of step.options"
            [class.active]="isActive(opt)"
            (click)="choose(opt)"
          >
            {{ opt }}
          </button>
        </div>
      </div>

      <!-- Columna derecha: imagen con animación al cambiar de paso -->
      <div class="onb__right">
        <img
          class="hero"
          [src]="heroSrc"
          alt=""
          [attr.data-bump]="bumpKey"
        />
      </div>
    </div>

    <!-- footer: bullets + acciones -->
    <div class="onb__footer">
      <div class="bullets">
        <span
          class="dot"
          *ngFor="let _ of steps; let j = index"
          [class.active]="j === i"
        ></span>
      </div>

      <div class="actions">
        <button class="btn btn--ghost" (click)="prev()" [disabled]="i === 0">Regresar</button>
        <button class="btn btn--primary" (click)="next()" [disabled]="!canNext()">
          {{ i < steps.length - 1 ? 'Siguiente' : 'Finalizar' }}
        </button>
      </div>
    </div>
  </div>
</section>
