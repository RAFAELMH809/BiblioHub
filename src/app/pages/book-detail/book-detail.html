<section class="book-detail" *ngIf="book as b">
  <!-- Flecha regresar -->
  <button
    type="button"
    class="book-detail__back"
    (click)="goBack()"
    aria-label="Volver"
  >
    <img src="assets/reading/flechaizq.png" alt="Volver" />
  </button>

  <div class="book-detail__container">
    <!-- ================= COLUMNA IZQUIERDA ================= -->
    <div class="book-detail__left">
      <!-- Portada + corazón -->
      <div class="book-detail__cover-wrap">
        <img
          [src]="b.cover"
          [alt]="b.title"
          class="book-detail__cover"
        />

        <button
          type="button"
          class="book-detail__fav-cover"
          [class.book-detail__fav-cover--active]="isFavorite"
          aria-label="Agregar a favoritos"
          (click)="toggleFavorite()"
        >
          <img
            [src]="
              isFavorite
                ? 'assets/reading/corazonlleno.png'
                : 'assets/reading/corazon.png'
            "
            alt="Favoritos"
          />
        </button>
      </div>

      <!-- Botones debajo del libro -->
      <div class="book-detail__actions">
        <button
          type="button"
          class="btn btn--download"
          (click)="descargar()"
        >
          <span class="btn__label">Descargar</span>
          <img src="assets/reading/download.png" alt="" />
        </button>

        <button
          type="button"
          class="btn btn--read"
          (click)="leerLibro()"
        >
          <span class="btn__label">Leer libro</span>
          <img src="assets/reading/leer.png" alt="" />
        </button>
      </div>
    </div>

    <!-- ================= COLUMNA DERECHA ================= -->
    <div class="book-detail__right">
      <h1 class="book-detail__title">
        {{ b.title | uppercase }}
      </h1>

      <h2 class="book-detail__author">
        {{ b.author }}
      </h2>

      <div class="book-detail__description-box">
        <p class="book-detail__description">
          {{ b.description }}
        </p>
      </div>

      <div class="book-detail__stats">
        <div class="stat">
          <img src="assets/reading/pages.png" alt="Páginas" />
          <div>
            <div class="stat__value">{{ b.pages }}</div>
            <div class="stat__label">Páginas</div>
          </div>
        </div>

        <div class="stat">
          <img src="assets/reading/hours.png" alt="Horas de lectura" />
          <div>
            <div class="stat__value">{{ b.hours }}</div>
            <div class="stat__label">Horas de lectura</div>
          </div>
        </div>

        <div class="stat">
          <img src="assets/reading/words.png" alt="Palabras" />
          <div>
            <div class="stat__value">{{ b.words }}</div>
            <div class="stat__label">Palabras</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
